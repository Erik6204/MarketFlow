<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ошибка входа | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
    <main class="page-shell">
        <header class="topbar">
            <a class="brand brand-dark" th:href="@{/}" href="/">MarketFlow</a>
            <a class="back-link" th:href="@{/}" href="/">← Вернуться назад</a>
        </header>

        <section class="centered-section" aria-labelledby="login-title">
            <div class="form-content">
                <div class="inline-alert" role="alert">
                    Неверный email или пароль. Проверьте данные и попробуйте ещё раз.
                </div>
                <p class="eyebrow">Повторная попытка</p>
                <h1 id="login-title">Вход</h1>

                <form class="auth-form"
                      th:action="@{/login/success}"
                      action="/login/success"
                      method="post">
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email"
                               name="email"
                               type="email"
                               maxlength="320"
                               autocomplete="email"
                               placeholder="alex@example.com"
                               required>
                    </div>

                    <div class="field">
                        <label for="password">Пароль</label>
                        <input id="password"
                               name="password"
                               type="password"
                               autocomplete="current-password"
                               placeholder="Ваш пароль"
                               required>
                    </div>

                    <button class="button button-primary" type="submit">
                        Войти
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
