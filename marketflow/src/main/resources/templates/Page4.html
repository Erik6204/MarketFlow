<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Корзина | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header class="market-header">
    <a class="market-brand" href="./catalog">MarketFlow</a>
    <nav class="market-nav" aria-label="Основная навигация">
        <a href="./catalog">Каталог</a>
        <a href="./cart" aria-current="page">Корзина</a>
        <a href="./account/cards">Карты</a>
        <a href="/account">Профиль</a>
    </nav>
</header>

<main class="market-main">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Ваш выбор</p>
            <h1>Корзина</h1>
            <p class="muted">Проверьте выбранные позиции перед оформлением.</p>
        </div>
        <a class="button button-secondary" href="./catalog">Добавить товары</a>
    </div>

    <section class="data-panel" th:if="${cartItems != null and !cartItems.isEmpty()}">
        <div class="data-row" th:each="item : ${cartItems}">
            <div>
                <div class="data-label">Товар</div>
                <div class="data-value" th:text="${'ID ' + item.productid}">ID товара</div>
            </div>
            <div>
                <div class="data-label">Количество</div>
                <div class="data-value" th:text="${item.quantity}">1</div>
            </div>
            <div class="card-actions">
                <form th:action="@{/account/cart/items/{id}/quantity(id=${item.id})}" method="post">
                    <input type="number" name="quantity" min="1" th:value="${item.quantity}" required>
                    <button class="button button-secondary" type="submit">Изменить количество</button>
                </form>
                <form th:action="@{/account/cart/items/{id}/select(id=${item.id})}" method="post">
                    <input type="hidden" name="choise" th:value="${!item.selected}">
                    <button class="button button-secondary" type="submit"
                            th:text="${item.selected ? 'Снять выбор' : 'Выбрать'}">
                        Выбрать
                    </button>
                </form>
                <form th:action="@{/account/cart/items/{id}/delete(id=${item.id})}" method="post">
                    <button class="button button-danger" type="submit">Удалить</button>
                </form>
            </div>
        </div>
    </section>

    <section class="empty-state" th:if="${cartItems == null or cartItems.isEmpty()}">
        <h2>Корзина пуста</h2>
        <p class="muted">Добавьте товары из каталога, чтобы продолжить.</p>
    </section>

    <div class="summary-band" th:if="${cartItems != null and !cartItems.isEmpty()}">
        <div>
            <div class="data-label">Следующий шаг</div>
            <div class="data-value">Расчёт итоговой суммы</div>
        </div>
        <a class="button button-primary" href="./checkout">Перейти к оформлению</a>
    </div>
</main>
</body>
</html>
