<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товар удалён | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header class="market-header">
    <a class="market-brand" th:href="@{/account/catalog}" href="/account/catalog">MarketFlow</a>
</header>
<main class="result-wrap">
    <section class="result-panel">
        <div class="result-mark warning">−</div>
        <p class="eyebrow">Корзина обновлена</p>
        <h1>Товар удалён</h1>
        <p class="muted">Позиция больше не входит в вашу корзину.</p>
        <div class="result-actions">
            <a class="button button-primary" th:href="@{/account/cart}" href="/account/cart">Открыть корзину</a>
            <a class="button button-secondary" th:href="@{/account/catalog}" href="/account/catalog">Продолжить покупки</a>
        </div>
    </section>
</main>
</body>
</html>
