<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товар | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header class="market-header">
    <a class="market-brand" href="../catalog">MarketFlow</a>
    <nav class="market-nav" aria-label="Основная навигация">
        <a href="../catalog">Каталог</a>
        <a href="../cart">Корзина</a>
        <a href="../account/cards">Карты</a>
        <a href="/account">Профиль</a>
    </nav>
</header>

<main class="market-main">
    <section class="detail-layout">
        <div class="detail-media">MarketFlow</div>
        <div class="detail-copy">
            <p class="eyebrow">Карточка товара</p>
            <h1>Информация о товаре</h1>
            <p class="detail-description" th:text="${product}">
                Подробное описание выбранного товара.
            </p>
            <div class="form-actions">
                <form id="add-product-form" method="post">
                    <button class="button button-primary" type="submit">Добавить в корзину</button>
                </form>
                <a class="button button-secondary" href="../catalog">Вернуться в каталог</a>
            </div>
        </div>
    </section>
</main>

<script>
    const productId = window.location.pathname.split('/').filter(Boolean).pop();
    document.getElementById('add-product-form').action = `../cart/items/${productId}`;
</script>
</body>
</html>
