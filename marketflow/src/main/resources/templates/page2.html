<!DOCTYPE html>

    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">

<body>

            <a class="button button-primary" th:href="@{/}" href="/">
                Перейти на главную

            <a class="back-link result-back" th:href="@{/}" href="/">← Вернуться назад</a>
        </section>
    </main>

</html>
