<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Выбор обновлён | MarketFlow</title>

</head>
<body>

</header>

        <div class="result-actions">
            <a class="button button-primary" href="../../../cart">Вернуться в корзину</a>
            <a class="button button-secondary" href="../../../checkout">К оформлению</a>
        </div>
    </section>
