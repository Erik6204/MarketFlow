<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
    <main class="auth-layout">
        <section class="brand-panel">
            <a class="brand" th:href="@{/}" href="/">MarketFlow</a>
            <div class="brand-copy">
                <p class="eyebrow">Маркетплейс</p>
                <h1>Покупки и продажи в одном месте</h1>
                <p>Войдите в существующий аккаунт или создайте новый профиль.</p>
            </div>
        </section>

        <section class="form-panel" aria-labelledby="welcome-title">
            <div class="form-content">
                <p class="eyebrow">Добро пожаловать</p>
                <h2 id="welcome-title">Начать работу</h2>
                <p class="supporting-text">Выберите подходящее действие.</p>

                <div class="action-stack">
                    <a class="button button-primary" th:href="@{/register}" href="/register">
                        Зарегистрироваться
                    </a>
                    <a class="button button-secondary" th:href="@{/login}" href="/login">
                        Войти
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
