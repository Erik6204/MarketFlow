<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Оформление | MarketFlow</title>
    <link rel="stylesheet" th:href="@{/css/market.css}" href="/css/market.css">
</head>
<body>
<header class="market-header">
    <a class="market-brand" th:href="@{/account/catalog}" href="/account/catalog">MarketFlow</a>
    <nav class="market-nav" aria-label="Основная навигация">
        <a th:href="@{/account/catalog}" href="/account/catalog">Каталог</a>
        <a th:href="@{/account/cart}" href="/account/cart">Корзина</a>
        <a th:href="@{/account/account/cards}" href="/account/account/cards">Карты</a>
        <a th:href="@{/Buyer/account}" href="/Buyer/account">Профиль</a>
    </nav>
</header>

<main class="market-main">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Оформление заказа</p>
            <h1>Проверка суммы</h1>
            <p class="muted">Итог рассчитан по товарам текущей корзины.</p>
        </div>
        <a class="button button-secondary" th:href="@{/account/cart}" href="/account/cart">Вернуться в корзину</a>
    </div>

    <section class="summary-band">
        <div>
            <div class="data-label">Итого к оплате</div>
            <div class="summary-total" th:text="${sum + ' ₽'}">0.00 ₽</div>
        </div>

        <div class="summary-action">
            <form th:if="${sum != null and sum.signum() > 0}"
                  th:action="@{/account/orders}"
                  action="/account/orders"
                  method="post">
                <button class="button button-primary" type="submit">Оформить заказ</button>
            </form>

            <div th:if="${sum == null or sum.signum() <= 0}">
                <button class="button button-primary" type="button" disabled>Оформить заказ</button>
                <p class="summary-hint">Выберите хотя бы один товар в корзине.</p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
