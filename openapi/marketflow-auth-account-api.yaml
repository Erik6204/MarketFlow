openapi: 3.0.3

info:
  title: MarketFlow Authentication and Account API
  version: 0.1.0
  description: Session-based registration, authentication and account access.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
  - name: Account

paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a buyer or seller
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '409':
          $ref: '#/components/responses/EmailAlreadyExists'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and create an HTTP session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
                example: JSESSIONID=abc123; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/ValidationErrorResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate the current HTTP session
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session invalidated successfully

  /api/v1/account:
    get:
      tags: [Account]
      summary: Get the authenticated user's account
      operationId: getAccount
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Account returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  schemas:
    RegisterRequest:
      type: object
      required: [accountType, email, password, display_name]
      properties:
        accountType:
          type: string
          enum: [BUYER, SELLER]
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          writeOnly: true
        display_name:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true

    Account:
      type: object
      required: [id, email, status, displayName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required: [seller]
          properties:
            seller:
              type: boolean

    ApiError:
      type: object
      required: [timestamp, status, code, message, path, validationErrors]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, format: int32 }
        code: { type: string }
        message: { type: string }
        path: { type: string }
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        traceId: { type: string, nullable: true }

    ValidationError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

  responses:
    ValidationErrorResponse:
      description: Request validation failed or the JSON body is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    EmailAlreadyExists:
      description: A user with this email already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidCredentials:
      description: Email or password is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    AuthenticationRequired:
      description: Authentication is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UserNotFound:
      description: Authenticated user no longer exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
